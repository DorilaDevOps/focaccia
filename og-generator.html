<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de imagen OG — FOCACCIA</title>
<style>
  body{ margin:0; background:#1a1a1a; color:#fff; font-family:system-ui; display:flex; flex-direction:column; align-items:center; padding:2rem; }
  canvas{ border:1px solid #333; max-width:100%; }
  .controls{ margin-top:1.5rem; display:flex; gap:1rem; flex-wrap:wrap; }
  button{ padding:.8rem 1.5rem; border:none; border-radius:8px; font-size:1rem; cursor:pointer; font-weight:600; }
  .btn-dl{ background:#A8351F; color:#fff; }
  .btn-dl:hover{ background:#7E2515; }
  p{ max-width:640px; text-align:center; color:#aaa; line-height:1.5; margin-top:1rem; }
</style>
</head>
<body>

<h1>Generador de imagen OG — FOCACCIA</h1>
<p>Hacé clic en "Descargar" para guardar la imagen como PNG (1200×630). Subila a <code>assets/img/og-image.png</code> en tu repositorio.</p>

<canvas id="og" width="1200" height="630"></canvas>

<div class="controls">
  <button class="btn-dl" onclick="download()">Descargar PNG</button>
</div>

<script>
const c = document.getElementById('og');
const ctx = c.getContext('2d');
const W = 1200, H = 630;

// Background gradient
const grad = ctx.createLinearGradient(0, 0, W, H);
grad.addColorStop(0, '#2B1D14');
grad.addColorStop(0.5, '#3D2A1E');
grad.addColorStop(1, '#1F3F2A');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, W, H);

// Decorative circle (warm glow)
const radGrad = ctx.createRadialGradient(900, 315, 50, 900, 315, 350);
radGrad.addColorStop(0, 'rgba(168,53,31,0.25)');
radGrad.addColorStop(1, 'rgba(168,53,31,0)');
ctx.fillStyle = radGrad;
ctx.fillRect(0, 0, W, H);

// Italian flag stripe at top
ctx.fillStyle = '#2F5D3F';
ctx.fillRect(0, 0, W, 6);
ctx.fillStyle = '#FBF3E7';
ctx.fillRect(0, 6, W, 6);
ctx.fillStyle = '#A8351F';
ctx.fillRect(0, 12, W, 6);

// Brand name
ctx.fillStyle = '#FBF3E7';
ctx.font = '700 72px Georgia, "Iowan Old Style", serif';
ctx.textAlign = 'left';
ctx.fillText('FOCACCIA', 80, 260);

// Subtitle
ctx.fillStyle = '#C08B2E';
ctx.font = '700 20px "Courier New", monospace';
ctx.textAlign = 'left';
ctx.fillText('BAR DE PIZZAS', 82, 305);

// Tagline
ctx.fillStyle = 'rgba(251,243,231,0.85)';
ctx.font = '400 28px Georgia, "Iowan Old Style", serif';
ctx.fillText('Pizza al horno de leña, hecha con calma.', 80, 370);

// Address
ctx.fillStyle = 'rgba(251,243,231,0.55)';
ctx.font = '400 17px "Courier New", monospace';
ctx.fillText('Águila Mora esq. Av. de las Garzas · Punta Colorada, Maldonado', 80, 420);

// Hours badge
const badgeX = 80, badgeY = 460, badgeW = 260, badgeH = 44;
ctx.fillStyle = '#A8351F';
roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 22);
ctx.fill();
ctx.fillStyle = '#FBF3E7';
ctx.font = '600 15px "Courier New", monospace';
ctx.textAlign = 'center';
ctx.fillText('JUE – SÁB  ·  20:00 – 00:00', badgeX + badgeW/2, badgeY + 28);
ctx.textAlign = 'left';

// Decorative pizza emoji on right side
ctx.font = '180px serif';
ctx.textAlign = 'center';
ctx.globalAlpha = 0.12;
ctx.fillText('🍕', 950, 420);
ctx.globalAlpha = 1;

// Bottom tricolor
ctx.fillStyle = '#2F5D3F';
ctx.fillRect(0, H - 8, W/3, 8);
ctx.fillStyle = '#FBF3E7';
ctx.fillRect(W/3, H - 8, W/3, 8);
ctx.fillStyle = '#A8351F';
ctx.fillRect(2*W/3, H - 8, W/3, 8);

// URL
ctx.fillStyle = 'rgba(251,243,231,0.4)';
ctx.font = '400 14px "Courier New", monospace';
ctx.textAlign = 'right';
ctx.fillText('focacciapuntacolorada.uy', W - 80, H - 24);

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function download() {
  const link = document.createElement('a');
  link.download = 'og-image.png';
  link.href = c.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
